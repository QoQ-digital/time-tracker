# =====================================================================
# Nginx snippet for Tetris Time Tracker (n8n behind path-based routing).
#
# This file is NOT a complete server block. It is a `location` snippet
# that you must paste INSIDE the existing `server { ... }` block for
# qoq-dev.xyz, alongside whatever other locations are already there.
#
# Steps:
#   1. SSH to the server and find the existing config, e.g.
#        /etc/nginx/sites-available/qoq-dev.xyz
#      or wherever you keep your server blocks.
#   2. Open it in an editor and paste the `location ...` block below
#      INSIDE the existing `server { ... }` for qoq-dev.xyz (the one
#      that listens on 443 with TLS).
#   3. Replace the suffix `tetris-n8n-7f3a9c2b` everywhere if you used
#      a different one (must match N8N_PATH in .env).
#   4. Test: `sudo nginx -t`
#   5. Reload: `sudo systemctl reload nginx`
#
# Why path-based and not a subdomain:
#   Per the spec, we deploy alongside the existing app on the same
#   domain without touching DNS. The existing server block keeps
#   serving its current locations; we only ADD a new one.
# =====================================================================

# ---- Begin paste here ----

# n8n editor + webhooks for Tetris Time Tracker.
# Trailing slash on the location is important (matches "/path/...").
# proxy_pass has NO trailing slash and NO URI, so nginx forwards the
# original path unchanged — which is what n8n needs because we set
# N8N_PATH=/tetris-n8n-7f3a9c2b/ inside the container.
location /tetris-n8n-7f3a9c2b/ {
    proxy_pass http://127.0.0.1:5678;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # n8n editor uses long-lived connections (websockets, push events).
    proxy_buffering        off;
    proxy_cache            off;
    proxy_read_timeout     86400;
    proxy_send_timeout     86400;
    chunked_transfer_encoding off;

    # Telegram + AI payloads can be a few hundred KB.
    client_max_body_size   50M;
}

# ---- End paste ----

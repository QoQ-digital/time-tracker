# tracker-dev.qoq-dev.xyz — reference nginx server blocks for the dev
# n8n stack. The live nginx on the host is a separate compose project at
# /srv/nginx/ that owns the single bind-mounted nginx.conf — this file is
# NOT auto-applied. Use it as the source-of-truth to append blocks to the
# live config (or to rebuild the dev vhost from scratch after a teardown).
#
# How to apply:
#
#   1. Append both server blocks below to /srv/nginx/nginx.conf in place.
#      Do NOT use `sed -i` or `mv` — those swap the inode and break the
#      bind mount. Use `cat tmp > /srv/nginx/nginx.conf` (truncate-and-
#      rewrite preserves the inode) after editing a copy.
#
#   2. Connect the nginx container to the dev docker network so the
#      proxy_pass container name resolves:
#         docker network connect tetris_net_dev nginx_nginx_1
#
#   3. Reload:
#         docker exec nginx_nginx_1 nginx -t
#         docker exec nginx_nginx_1 nginx -s reload
#
# Prereqs:
#   - DNS A-record tracker-dev.qoq-dev.xyz -> 188.34.205.181 has propagated.
#   - Let's Encrypt cert issued (webroot mode through the same nginx):
#         docker run --rm \
#           -v nginx_certbot-etc:/etc/letsencrypt \
#           -v nginx_certbot-var:/var/www/certbot \
#           certbot/certbot certonly --webroot -w /var/www/certbot \
#           -d tracker-dev.qoq-dev.xyz \
#           --agree-tos --no-eff-email \
#           -m yarikhaker@gmail.com --non-interactive

# ---- tracker-dev.qoq-dev.xyz (HTTP — ACME challenge + redirect) ----
server {
    listen 80;
    server_name tracker-dev.qoq-dev.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- tracker-dev.qoq-dev.xyz (HTTPS — proxy to dev n8n) ----
server {
    listen 443 ssl;
    http2 on;
    server_name tracker-dev.qoq-dev.xyz;

    ssl_certificate     /etc/letsencrypt/live/tracker-dev.qoq-dev.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker-dev.qoq-dev.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        # tetris-n8n-dev is the container name on tetris_net_dev. nginx
        # must be a member of that network (see "How to apply" above).
        proxy_pass http://tetris-n8n-dev:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # n8n SSE/WebSocket needs buffering off + long timeouts.
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     86400;
        proxy_send_timeout     86400;
        chunked_transfer_encoding off;

        client_max_body_size   50M;
    }
}

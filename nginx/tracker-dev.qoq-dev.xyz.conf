# tracker-dev.qoq-dev.xyz — nginx server block for the dev n8n stack.
#
# Drop this file into the existing nginx_nginx_1 container's conf.d dir
# (on this host that bind-mount lives at /srv/nginx/conf.d/) and reload:
#
#     docker exec nginx_nginx_1 nginx -t
#     docker exec nginx_nginx_1 nginx -s reload
#
# Prereqs:
#   - DNS A-record tracker-dev.qoq-dev.xyz -> 188.34.205.181 has propagated
#   - Let's Encrypt cert issued, e.g.:
#       docker run --rm -it \
#         -v /etc/letsencrypt:/etc/letsencrypt \
#         -v /var/lib/letsencrypt:/var/lib/letsencrypt \
#         -p 80:80 \
#         certbot/certbot certonly --standalone \
#         -d tracker-dev.qoq-dev.xyz \
#         --agree-tos -m yarikhaker@gmail.com --non-interactive
#     (or whatever the existing prod cert-issuance flow on this host is)
#
# Replace ${DEV_N8N_PATH_SUFFIX} with the actual value from the secret
# before pasting — nginx does not expand env vars in config files.

server {
    listen 80;
    server_name tracker-dev.qoq-dev.xyz;
    # Redirect everything to HTTPS. Certbot challenge path can be allowed
    # here if you ever switch to webroot mode instead of standalone.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tracker-dev.qoq-dev.xyz;

    ssl_certificate     /etc/letsencrypt/live/tracker-dev.qoq-dev.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker-dev.qoq-dev.xyz/privkey.pem;

    # Anything outside the path-prefix is a 404. The whole point of the
    # opaque suffix is to keep the dev editor un-discoverable.
    location / {
        return 404;
    }

    location /tetris-n8n-dev-${DEV_N8N_PATH_SUFFIX}/ {
        proxy_pass http://127.0.0.1:5679;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # n8n SSE/WebSocket needs these off + long timeouts
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     86400;
        proxy_send_timeout     86400;
        chunked_transfer_encoding off;

        client_max_body_size   50M;
    }
}
